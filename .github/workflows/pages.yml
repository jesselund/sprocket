name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "style-guide/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site with style guide tokens
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/style-guide
          cp style-guide/tokens.css _site/style-guide/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
